name: distnoted
on:
  push:
    paths: ['darwin/distnoted/**', '.github/workflows/distnoted.yml']
  pull_request:
    paths: ['darwin/distnoted/**', '.github/workflows/distnoted.yml']
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang and lld
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld llvm
      - name: Build the Mach-O daemon
        run: CC=clang LD64=$(ls /usr/lib/llvm-*/bin/ld64.lld | tail -1) sh darwin/distnoted/build.sh out
      - name: Check the binary and the jobs
        run: |
          file out/distnoted | grep -q 'Mach-O 64-bit x86_64 executable'
          OD=$(ls /usr/lib/llvm-*/bin/llvm-objdump | tail -1)
          $OD --macho --dylibs-used out/distnoted | tee dylibs.txt
          grep -q 'libSystem.B.dylib' dylibs.txt
          $OD --macho --syms out/distnoted | grep -q '_main'
          for p in darwin/distnoted/launchd/*.plist; do python3 -c "import plistlib,sys; d=plistlib.load(open(sys.argv[1],'rb')); assert d['Label'] and d['MachServices']" "$p"; done
