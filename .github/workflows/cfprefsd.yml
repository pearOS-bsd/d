name: cfprefsd
on:
  push:
    paths: ['darwin/cfprefsd/**', '.github/workflows/cfprefsd.yml']
  pull_request:
    paths: ['darwin/cfprefsd/**', '.github/workflows/cfprefsd.yml']
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang and lld
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld llvm
      - name: Build the Mach-O daemon (no Apple SDK)
        run: CC=clang LD64=$(ls /usr/lib/llvm-*/bin/ld64.lld | tail -1) sh darwin/cfprefsd/build.sh out
      - name: Check the binary, the tbd files and the jobs
        run: |
          file out/cfprefsd | grep -q 'Mach-O 64-bit x86_64 executable'
          OD=$(ls /usr/lib/llvm-*/bin/llvm-objdump | tail -1)
          $OD --macho --dylibs-used out/cfprefsd | tee dylibs.txt
          grep -q 'libSystem.B.dylib' dylibs.txt
          grep -q 'CoreFoundation.framework/Versions/A/CoreFoundation' dylibs.txt
          $OD --macho --syms out/cfprefsd | grep -q '_main'
          # the .tbd files list every symbol the object needs (regenerated by gen-tbd.sh)
          cp darwin/cfprefsd/libSystem.tbd darwin/cfprefsd/CoreFoundation.tbd /tmp/
          PATH=$(dirname $(ls /usr/lib/llvm-*/bin/llvm-nm | tail -1)):$PATH sh darwin/cfprefsd/gen-tbd.sh
          diff /tmp/libSystem.tbd darwin/cfprefsd/libSystem.tbd && diff /tmp/CoreFoundation.tbd darwin/cfprefsd/CoreFoundation.tbd
          for p in darwin/cfprefsd/launchd/*.plist; do python3 -c "import plistlib,sys; d=plistlib.load(open(sys.argv[1],'rb')); assert d['Label'] and d['MachServices'] and d['ProgramArguments'][1] in ('agent','daemon')" "$p"; done
      - name: The wire protocol constants match the specification
        run: |
          for k in CFPreferencesOperation CFPreferencesMessages CFPreferencesPropertyList CFPreferencesShmemName CFPreferencesShmemIndex CFPreferencesShmemState CFPreferencesByteCountThreshold CFPreferencesValidationPropertyList CFPreferencesErrorType CFPreferencesErrorDescription CFPreferencesAccessToken CFPreferencesUncanonicalizedPath CFPreferencesEndpoint CFPreferencesPID; do grep -q "\"$k\"" darwin/cfprefsd/cfprefsd.c || { echo "missing $k"; exit 1; }; done
          grep -q '"%scfprefs.%dv%d"' darwin/cfprefsd/cfprefsd.c
          grep -q '"%scfprefs.daemonv%d"' darwin/cfprefsd/cfprefsd.c
